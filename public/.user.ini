; PHP settings for shared hosts running PHP as FastCGI/FPM (most do). Read per directory; ignored by
; mod_php and the built-in dev server. bootstrap.php sets display_errors at run time too, but only
; this file covers errors raised before the app starts (e.g. a parse error after a bad upload).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
